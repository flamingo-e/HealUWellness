/* Heal U Wellness - Soft Sage & Mauve Accent Palette */

:root {
  --cream: #f7f4f1;
  --petal: #f5f6f2;
  --blush: #e6ebdf;
  --orchid: #dcd4db;
  --mauve: #bfb6bd;
  --deep-mauve: #7a8e6d; /* soft sage green */
  --sand: #dfe7d2;
  --white: #ffffff;
  --charcoal: #2f2b2d;
  --text-muted: #70776a;
  --shadow: 0 18px 38px rgba(122, 142, 109, 0.16);
  --radius: 18px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Raleway', sans-serif;
  font-weight: 300;
  margin: 0;
  background: linear-gradient(180deg, #c8d9c0 0%, #dbe8d2 55%, #f0f5ed 100%);
  color: var(--charcoal);
  line-height: 1.7;
}

h1, h2, h3, h4, h5, h6 {
  font-family: 'Raleway', sans-serif;
  font-weight: 600;
  letter-spacing: 0.02em;
}

img {
  max-width: 100%;
  display: block;
  height: auto;
}

a {
  color: inherit;
  text-decoration: none;
}

main {
  padding: 0 1.5rem 1.5rem;
}

section {
  padding: 1.5rem 0;
  max-width: 1100px;
  margin: 0 auto;
}

.site-header {
  background: var(--petal);
  border-bottom: 1px solid var(--blush);
}

.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.1rem 0.5rem;
}

.brand-logo {
  width: 160px;
  min-width: 140px;
}

.main-nav {
  display: flex;
  align-items: center;
  margin-left: auto;
  background: transparent;
  border: none;
  box-shadow: none;
}

.main-nav ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
  flex-wrap: wrap;
  font-family: 'Raleway', sans-serif;
  font-weight: 400;
  color: var(--deep-mauve);
  letter-spacing: 0.03em;
}

.main-nav li {
  display: inline-flex;
  position: relative;
}

.main-nav a {
  padding: 0.35rem 0.8rem;
  border-radius: 999px;
  transition: background 0.2s ease, color 0.2s ease;
}

.main-nav a:hover,
.main-nav a:focus {
  background: var(--blush);
  color: var(--charcoal);
}

.main-nav .dropdown {
  position: relative;
}

.main-nav .dropdown-menu {
  position: absolute;
  top: 100%;
  left: 0;
  background: var(--white);
  border: 1px solid var(--blush);
  border-radius: 12px;
  box-shadow: var(--shadow);
  min-width: 160px;
  padding: 0.5rem 0;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  z-index: 100;
  margin-top: 0.5rem;
}

.main-nav .dropdown:hover .dropdown-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.main-nav .dropdown-menu a {
  display: block;
  padding: 0.6rem 1rem;
  border-radius: 0;
  white-space: nowrap;
}

.main-nav .dropdown-menu a:hover {
  background: var(--blush);
  border-radius: 0;
}

.page-title {
  text-align: center;
  margin: 3rem auto 2rem;
  max-width: 1100px;
  padding: 0 1.5rem;
}

.page-title h1 {
  font-size: 3rem;
  margin: 0 0 1rem;
  color: var(--deep-mauve);
  letter-spacing: 0.01em;
}

.page-title p {
  font-size: 1.2rem;
  color: var(--text-muted);
  max-width: 700px;
  margin: 0 auto;
}

.waiver-container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
  background: var(--white);
  border-radius: var(--radius);
  border: 1px solid var(--blush);
  box-shadow: var(--shadow);
}

footer {

  color: var(--white);
  text-align: center;
  padding: 2.2rem 1.5rem;

  overflow: hidden;
  margin-top: 4rem;

footer::before {

footer a {

footer p {

@media (max-width: 768px) {

  .page-title p {
    font-size: 1rem;
  }
}
